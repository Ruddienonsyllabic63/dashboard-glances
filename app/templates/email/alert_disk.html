<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Alerta de Disco</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto;">
    <div style="background: #dbeafe; border: 2px solid #3b82f6; border-radius: 12px; padding: 20px;">
        <h2 style="color: #1d4ed8; margin-top: 0;">⚠ Alerta de Disco</h2>
        <table style="width: 100%; border-collapse: collapse;">
            <tr>
                <td style="padding: 8px 0; font-weight: bold; width: 120px;">🖥 Máquina:</td>
                <td style="padding: 8px 0;">{{ machine_name }}</td>
            </tr>
            <tr>
                <td style="padding: 8px 0; font-weight: bold;">💿 Disco Atual:</td>
                <td style="padding: 8px 0; color: #1d4ed8; font-weight: bold; font-size: 18px;">{{ disk_percent }}%</td>
            </tr>
            <tr>
                <td style="padding: 8px 0; font-weight: bold;">🎯 Limite:</td>
                <td style="padding: 8px 0;">{{ threshold }}%</td>
            </tr>
            <tr>
                <td style="padding: 8px 0; font-weight: bold;">📅 Data/Hora:</td>
                <td style="padding: 8px 0;">{{ timestamp }}</td>
            </tr>
        </table>
    </div>
    <p style="color: #666; font-size: 12px; margin-top: 15px;">Glances Dashboard - Monitoramento Automático</p>
</body>
</html>
